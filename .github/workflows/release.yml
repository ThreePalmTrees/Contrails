name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./buildMacOS.sh "${{ steps.version.outputs.VERSION }}" "${{ secrets.POSTHOGAPIKEY }}"

      - name: Zip .app bundle with install instructions
        run: |
          cd build/bin
          cp ../../how_to_install.txt .
          zip -r ../../Contrails-macos.zip contrails.app how_to_install.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: Contrails-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: ./buildWindows.sh "${{ steps.version.outputs.VERSION }}" "${{ secrets.POSTHOGAPIKEY }}"

      - name: Zip Windows executable
        shell: pwsh
        run: Compress-Archive -Path build/bin/contrails.exe -DestinationPath Contrails-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: Contrails-windows.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./buildLinux.sh "${{ steps.version.outputs.VERSION }}" "${{ secrets.POSTHOGAPIKEY }}"

      - name: Zip Linux binary
        run: |
          cd build/bin
          zip -r ../../Contrails-linux.zip contrails

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: Contrails-linux.zip

  release:
    if: ${{ !contains(github.ref_name, '-rc') }}
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-build

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Contrails v${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Contrails-macos.zip
            Contrails-windows.zip
            Contrails-linux.zip
